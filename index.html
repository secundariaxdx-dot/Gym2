<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym</title>
<meta name="theme-color" content="#f3f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f4f0; --card: #ffffff; --text: #16181a; --muted: #697077; --line: #e1e4dd; --input: #eceee8;
  --accent: #2c7a10; --on-accent: #ffffff; --accent-soft: #e2f1d9;
  --warn: #9a5b00; --warn-bg: #fdf0d6; --danger: #b3261e; --danger-bg: #fbe6e4;
  --tab-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0e0f; --card: #17191b; --text: #f0f2ec; --muted: #8d959b; --line: #262a2d; --input: #23272a;
    --accent: #b8f24a; --on-accent: #10160a; --accent-soft: #1f2a10;
    --warn: #f5b84b; --warn-bg: #2b2310; --danger: #ff8078; --danger-bg: #301816;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  touch-action: manipulation; overscroll-behavior-y: none;
}
body.modal-open { overflow: hidden; }
#app { padding: calc(env(safe-area-inset-top) + 14px) 16px calc(var(--tab-h) + var(--wp, 0px) + var(--tm, 0px) + env(safe-area-inset-bottom) + 28px); max-width: 560px; margin: 0 auto; }
h1 { font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
h2 { font-size: 19px; margin: 0 0 4px; }
h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 22px 4px 8px; font-weight: 600; }
p { margin: 6px 0 12px; }
.cap::first-letter { text-transform: uppercase; }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; margin-top: 18px; }
.pad { padding: 16px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin: 0 0 12px; overflow: hidden; }
.card.pad { padding: 16px; }
.routine { padding: 16px; }
.r-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.r-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.r-btns .btn { flex: 1; }
.r-btns.tight { margin: 0; flex-wrap: nowrap; }
.r-btns.tight .btn { flex: none; min-width: 40px; }

.btn {
  appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
  font: inherit; font-weight: 600; padding: 12px 16px; border-radius: 12px; min-height: 46px; cursor: pointer;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 8px 12px; min-height: 38px; font-size: 14px; }
.btn.wide { width: 100%; margin: 6px 0 10px; }
.link { appearance: none; background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600; padding: 14px; width: 100%; cursor: pointer; }
.link.danger { color: var(--danger); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.chip { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--input); color: var(--muted); border: 0; font-family: inherit; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.tog { cursor: pointer; min-height: 30px; }
.chip.tog.on { background: var(--accent); color: var(--on-accent); }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent-soft); color: var(--text); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.col { flex-direction: column; align-items: stretch; }
.banner.col .r-btns { margin-top: 8px; }
.hint { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
.hint b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.hint.warmup { color: var(--text); background: var(--input); padding: 8px 10px; border-radius: 10px; }
.empty { color: var(--muted); text-align: center; padding: 22px 12px; font-size: 15px; }

.ex-head { appearance: none; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
.ex-name { font-weight: 600; font-size: 16px; }
.ex-count { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; color: var(--muted); background: var(--input); padding: 4px 10px; border-radius: 999px; }
.ex-count.full { background: var(--accent); color: var(--on-accent); }
.ex-body { padding: 0 16px 14px; }
.card.ex.open { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

.set { display: grid; grid-template-columns: 24px 1fr 74px 62px 46px; gap: 8px; align-items: center; margin: 6px 0; }
.set.head { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; margin-top: 4px; }
.set .n { color: var(--muted); font-weight: 700; text-align: center; }
.set .tgt { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
.in { width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid transparent; background: var(--input); color: var(--text); font: inherit; font-size: 17px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; padding: 0 4px; }
.in:focus { outline: none; border-color: var(--accent); }
.chk { height: 46px; width: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.set.done .chk { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.set.done .in { opacity: 0.6; }
.set.err { animation: shake 0.35s; }
.set.err .in { border-color: var(--danger); }
@keyframes shake { 20% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 80% { transform: translateX(-3px); } }
.ex-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

.item { display: block; width: 100%; text-align: left; padding: 12px 16px; font: inherit; color: inherit; cursor: pointer; }
.search { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; padding: 0 14px; margin: 14px 0 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.list { padding: 0 16px; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li.col { flex-direction: column; align-items: stretch; gap: 6px; }
.li-row { display: flex; justify-content: space-between; align-items: baseline; }
.li .right { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter { position: relative; height: 8px; border-radius: 99px; background: var(--input); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
.meter b { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--text); opacity: 0.6; }

.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; }
.switch input { width: 24px; height: 24px; accent-color: var(--accent); }

#tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
.tab { flex: 1; height: var(--tab-h); appearance: none; background: none; border: 0; color: var(--muted); font: inherit; font-size: 11.5px; font-weight: 600; display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center; cursor: pointer; }
.tab.on { color: var(--accent); }


#modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
#modal[hidden], #timer[hidden], #toast[hidden], #wprog[hidden] { display: none; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 10px 0 0; }
.sheet .lbl { font-size: 13px; color: var(--muted); font-weight: 600; margin: 14px 0 0; }
.sheet label input, .sheet label select { display: block; width: 100%; margin-top: 4px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 16px; padding: 0 12px; }
.sheet label.switch { color: var(--text); font-size: 16px; font-weight: 500; }
.sheet label.switch input { width: 24px; height: 24px; margin: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ta { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: 13px/1.4 ui-monospace, Menlo, monospace; padding: 10px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + var(--wp, 0px) + var(--tm, 0px) + env(safe-area-inset-bottom) + 14px); background: var(--text); color: var(--bg); padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 60; max-width: 90vw; }

.li.col .chip { align-self: flex-start; }

.pad0 { padding: 0 4px 8px; }
.btn:disabled { opacity: 0.35; }
.btn.act.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 10px; }
.cal-nav h2 { margin: 0; font-size: 18px; }
.cal-nav .btn { min-width: 44px; font-size: 20px; padding: 4px 12px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-wd { font-size: 11.5px; color: var(--muted); text-align: center; font-weight: 600; padding: 2px 0 4px; }
.cal-d { appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 10px; min-height: 58px; padding: 5px 1px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; color: var(--text); cursor: pointer; }
.cal-d .dn { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.cal-d .ic { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; font-size: 13px; line-height: 15px; }
.cal-d.gym { background: var(--accent-soft); border-color: transparent; }
.cal-d.gym .dn, .ic-gym { color: var(--accent); }
.ic-gym svg { vertical-align: -3px; }
.cal-d.today { border: 2px solid var(--accent); }
.cal-d.fut { opacity: 0.35; cursor: default; }
.cal-d.blank { background: none; border: 0; }
.cal-sum { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; font-weight: 600; margin: 14px 4px 6px; }
.an-ic { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 13px; font-weight: 800; margin-right: 8px; background: var(--input); color: var(--muted); vertical-align: 1px; }
.an.add .an-ic, .an.keep .an-ic { background: var(--accent-soft); color: var(--accent); }
.an.remove .an-ic, .an.warn .an-ic { background: var(--warn-bg); color: var(--warn); }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 80; }
#pr { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); z-index: 81; pointer-events: none; background: #16181a; color: #f0f2ec; border-radius: 22px; padding: 18px 26px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); min-width: 240px; max-width: 86vw; }
@media (prefers-color-scheme: dark) { #pr { background: #f0f2ec; color: #16181a; } #pr .pr-v { color: #2c7a10 !important; } }
#pr[hidden] { display: none; }
#pr.go { animation: pop 2.6s ease-out forwards; }
#pr .pr-t { font-size: 22px; font-weight: 800; }
#pr .pr-n { font-size: 15px; opacity: 0.75; margin-top: 4px; }
#pr .pr-v { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; color: #b8f24a; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; } 10% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; } 16% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }
.tab span { font-size: 10.5px; }

.nw { white-space: nowrap; }

.chips.scroll { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 8px -16px 0; padding: 0 16px 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; }
.sheet .chips.scroll { margin: 8px -16px 0; }
.grp { font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 4px 6px; }
.item.lib .ex-name::before { content: '+ '; color: var(--accent); font-weight: 800; }
.li-main { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; flex: 1; cursor: pointer; }
#f-rname { font-weight: 600; }

.top-act { display: flex; gap: 8px; align-items: center; }
.mute-b { font-size: 17px; line-height: 1; }
.btn.mute-b { padding: 8px 10px; }
.mute-b.off { opacity: 0.6; }


/* Gráficos de progreso */
.chart { position: relative; margin: 6px 0 2px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.chart .bar { fill: var(--accent); }
.chart .bar.low { fill: color-mix(in srgb, var(--accent) 45%, var(--card)); }
.chart .band { fill: var(--accent-soft); }
.chart .band-l { fill: var(--muted); font-size: 10px; }
.chart .hl { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hit { fill: transparent; }
.chart-tip { min-height: 18px; font-size: 13px; color: var(--muted); margin-top: 2px; }
.chart-tip b { color: var(--text); }
.prog-ex { width: 100%; text-align: left; appearance: none; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; }
.li.open { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
.chart-box { padding: 4px 0 6px; }
.chart-sum { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.chart-sum b { color: var(--text); }
select.musc { flex: 1; min-width: 0; width: 100%; font: inherit; font-weight: 600; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--input); color: var(--text); margin: 4px 0 8px; }
.musc-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.musc-row select.musc { margin: 0; }
.musc-row .btn { white-space: nowrap; min-height: 44px; }

/* Franja única encima de las pestañas: descanso (si lo hay) + línea de progreso del entreno */
body.has-timer { --tm: 50px; }
body.has-wprog { --wp: 22px; }
#dock { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); z-index: 21; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); }
body:not(.has-timer):not(.has-wprog) #dock { display: none; }
#timer { position: relative; height: 50px; }
#timer.fin { background: var(--accent); color: var(--on-accent); }
#timer .row { display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 12px; max-width: 560px; margin: 0 auto; }
#timer .tt { flex: 1; display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
#timer .tl { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
#timer.fin .tl { color: inherit; opacity: 0.75; }
#timer .t { font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; }
#timer button { appearance: none; border: 0; border-radius: 10px; height: 38px; padding: 0 11px; font: inherit; font-size: 15px; font-weight: 700; background: var(--input); color: inherit; cursor: pointer; }
#timer.fin button { background: color-mix(in srgb, var(--on-accent) 14%, transparent); }
#timer .bar { position: absolute; left: 0; right: 0; top: -1px; height: 3px; overflow: hidden; }
#timer .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s linear; }
#timer.fin .bar i { background: var(--on-accent); }
#wprog { height: 22px; display: flex; align-items: center; gap: 10px; padding: 0 16px; max-width: 560px; margin: 0 auto; }
#wprog .wp-bar { flex: 1; height: 5px; border-radius: 5px; background: var(--input); overflow: hidden; }
#wprog .wp-bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--accent); transition: width 0.35s ease; }
#wprog .wp-t { font-size: 11.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
#toast button { appearance: none; border: 0; background: none; font: inherit; font-weight: 800; color: inherit; text-decoration: underline; padding: 4px 2px; cursor: pointer; white-space: nowrap; }
section.ex { scroll-margin-top: calc(env(safe-area-inset-top) + 12px); scroll-margin-bottom: 150px; }
.lib-tog { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }

/* ================= v2.0 · pulido visual ================= */
:root { --r-card: 20px; --r-ctl: 13px; --shadow: 0 1px 2px rgba(20, 28, 16, 0.05), 0 10px 26px -14px rgba(20, 28, 16, 0.18); }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0c0d; --card: #16181a; --line: #25292c; --input: #222629; --shadow: none; } }
body { -webkit-font-smoothing: antialiased; }
h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.012em; }
h3.sec { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; margin: 26px 4px 10px; }
.sub { font-size: 14.5px; }
.card { border-radius: var(--r-card); box-shadow: var(--shadow); }
.banner { border-radius: 16px; }

/* Botones */
.btn { border-radius: var(--r-ctl); transition: transform 0.12s ease, opacity 0.12s ease, background-color 0.15s ease; }
.btn:active { transform: scale(0.97); opacity: 0.85; }
.btn.primary { font-weight: 700; box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--accent) 80%, transparent); }
.btn.sm { border-radius: 11px; }
.link:active { opacity: 0.6; }

/* Interruptores al estilo iOS */
.switch input, .sheet label.switch input { appearance: none; -webkit-appearance: none; flex: none; display: block; position: relative; width: 51px; height: 31px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--muted) 38%, var(--input)); cursor: pointer; transition: background-color 0.2s ease; }
.switch input::before { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.28); transition: transform 0.22s cubic-bezier(0.3, 1.3, 0.5, 1); }
.switch input:checked, .sheet label.switch input:checked { background: var(--accent); }
.switch input:checked::before { transform: translateX(20px); }
.switch input:disabled { opacity: 0.4; }
.switch { margin: 10px 0; min-height: 34px; }

/* Barra de pestañas: la activa lleva una píldora detrás del icono */
.tab { gap: 2px; transition: color 0.15s ease; }
.tab svg { box-sizing: content-box; padding: 3px 16px; border-radius: 999px; transition: background-color 0.2s ease; }
.tab.on svg { background: var(--accent-soft); }
.tab:active svg { background: var(--input); }

/* Hoy: resumen de la semana */
.week { display: block; width: 100%; appearance: none; text-align: left; font: inherit; color: inherit; padding: 14px 14px 16px; cursor: pointer; }
.wk-top { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 12px; }
.wk-t { font-weight: 700; font-size: 15px; }
.wk-n { color: var(--muted); font-size: 14px; }

/* ================= v2.3 · estructura estable en iOS =================
   Antes la página entera se desplazaba y la barra inferior era una capa fija (position: fixed). En iOS, al
   volver de otra app, esa capa podía quedarse descolocada y moverse con el contenido. Ahora el documento no
   se desplaza nunca: solo lo hace #scroller, y la franja del descanso y las pestañas son piezas normales
   debajo de él. */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
html { background: var(--bg); }
/* En la app instalada, iOS calcula «100 %» sin la franja del indicador de inicio y quedaba un hueco negro
   debajo de las pestañas: se ancla el cuerpo a los cuatro bordes de la pantalla. */
body { position: fixed; top: 0; right: 0; bottom: 0; left: 0; height: auto; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
#scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
body.modal-open #scroller { overflow: hidden; }
#app { padding: 14px 16px 28px; }
#dock, #tabs { position: static; flex: none; -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--card); }
section.ex { scroll-margin-top: 12px; scroll-margin-bottom: 12px; }

/* v2.5 · iOS 26 (WebKit 301108): en la app instalada con barra de estado translúcida, la ventana mide
   la altura de la barra de estado de menos mientras la página no sea más alta que la pantalla, y
   todo lo anclado abajo se queda corto (franja negra bajo las pestañas). Si el documento es al menos tan
   alto como la pantalla, iOS le da la ventana completa. min() evita pasarse donde el fallo no existe. */
@media (display-mode: standalone) {
  html { height: auto; min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); }
}
#tabs { padding-bottom: max(6px, env(safe-area-inset-bottom)); }

<body>
<div id="scroller"><div id="ptr" aria-hidden="true"><span class="ptr-s"></span></div><main id="app"></main></div>
<div id="dock">
  <div id="timer" hidden>
    <div class="bar"><i></i></div>
    <div class="row"><div class="tt"><span class="tl">Descanso</span><span class="t">0:00</span></div><button class="mute-b" data-a="mute" aria-label="Silenciar sonidos"></button><button data-a="t-m">−15</button><button data-a="t-p">+15</button><button data-a="t-x">Saltar</button></div>
  </div>
  <div id="wprog" hidden><div class="wp-bar"><i></i></div><span class="wp-t"></span></div>
</div>
<nav id="tabs"></nav>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<div id="pr" hidden></div>
<script>
/* Motor de progresión — doble progresión por serie, entrenando al fallo.
   Sin dependencias del DOM: se puede probar con node. */
(function (root) {
  'use strict';

  var round1 = function (x) { return Math.round(x * 10) / 10; };
  var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };

  // Estimación de 1RM (Epley) y repeticiones esperadas con otro peso.
  function e1rm(w, r) { return w * (1 + r / 30); }
  function repsAt(oneRm, w) { return 30 * (oneRm / w - 1); }

  // ¿El peso está en la "rejilla" del salto? (los pesos de pila en libras no lo están)
  function onGrid(w, step) {
    var q = w / step;
    return Math.abs(q - Math.round(q)) < 0.05;
  }
  // Redondea w a la rejilla del salto si el peso de referencia está en ella; si no, a 0,5.
  function snap(w, step, refW) {
    if (onGrid(refW === undefined ? w : refW, step)) return round1(Math.round(w / step) * step);
    return round1(Math.round(w * 2) / 2);
  }

  /* Objetivo para una serie a partir de lo que hiciste en esa misma posición. */
  function nextTarget(ex, w, r) {
    var step = ex.step || 2.5;
    var min = ex.repMin || 8;
    var max = ex.repMax || 12;
    if (ex.equip === 'corporal' && !(w > 0)) return { w: 0, r: Math.min(r + 1, max + 8), kind: 'repite' }; // sin lastre: suma repeticiones
    if (r >= max) {
      var jumps = r >= max + 3 ? 2 : 1; // si te sobran muchas, salto doble
      var nw = round1(w + step * jumps);
      var est = Math.round(repsAt(e1rm(w, r), nw));
      return { w: nw, r: clamp(est, min, max), kind: 'sube' };
    }
    return { w: w, r: Math.min(r + 1, max), kind: r < min ? 'bajo' : 'repite' };
  }

  /* Referencia: lo último que hiciste con el ejercicio (sesión real o base inicial/ajuste). */
  function reference(ex, sessions) {
    var best = null;
    for (var i = 0; i < sessions.length; i++) {
      var s = sessions[i];
      for (var j = 0; j < s.exercises.length; j++) {
        var e = s.exercises[j];
        if (e.exId === ex.id && e.sets.length) {
          if (!best || s.t > best.t) best = { t: s.t, sets: e.sets, source: 'session' };
        }
      }
    }
    if (ex.baseline && ex.baseline.sets && ex.baseline.sets.length) {

  document.addEventListener('input', function (ev) {
    var t = ev.target, f = t.getAttribute && t.getAttribute('data-f'); if (!f) return;
    if (f === 'w' || f === 'r') {
      var s = state.active.entries[+t.getAttribute('data-i')].sets[+t.getAttribute('data-j')];
      s[f] = t.value; if (s.done) { s.done = false; var row = t.closest('.set'); if (row) row.classList.remove('done'); save(); updateWprog(); }
      else saveSoon();
    } else if (f === 'q') { ui.query = t.value; $('#ex-list').innerHTML = exListHtml(); }
    else if (f === 'pq') { ui.modal.q = t.value; $('#pick-list').innerHTML = pickList(); }
    else if (f === 'rname' && ui.modal && state.routines[ui.modal.key]) { state.routines[ui.modal.key].name = t.value.trim() || 'Rutina'; save(); render(); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.getAttribute && t.getAttribute('data-f') === 'sound') { state.settings.sound = t.checked; save(); syncMute(); pushSync(); }
    else if (t.getAttribute && t.getAttribute('data-f') === 'push') { if (t.checked) enablePush(); else { if (timer && timer.armed) { pushStop(); timer.armed = 0; } state.settings.push = false; save(); render(); } }
    else if (t.getAttribute && t.getAttribute('data-f') === 'progM') { ui.progM = t.value; render(); }
    else if (t.getAttribute && t.getAttribute('data-f') === 'actFatigue') { state.settings.actFatigue = t.checked; save(); }
    else if (t.getAttribute && t.getAttribute('data-f') === 'photo') { if (t.files && t.files.length) addPhotos(t.getAttribute('data-sid'), t.files); t.value = ''; }
    else if (t.id === 'file' && t.files && t.files[0]) { var rd = new FileReader(); rd.onload = function () { importText(String(rd.result)); }; rd.readAsText(t.files[0]); t.value = ''; }
    else if (t.getAttribute && t.getAttribute('data-f') === 'c-kind' && ui.modal && ui.modal.type === 'clase') { ui.modal.kind = t.value; renderModal(); }
    else if (t.id === 'f-equip' && ui.modal && ui.modal.type === 'exedit' && ui.modal.isNew && !ui.modal.stepTouched) { $('#f-step').value = fmt(STEP_DEFAULT[t.value] || 2.5); $('#f-unit').value = 'kg'; }
  });
  document.addEventListener('focusin', function (ev) {
    var t = ev.target;
    if (t.classList && t.classList.contains('in')) setTimeout(function () { try { t.select(); } catch (e) { /* nada */ } }, 0);
    if (t.id === 'f-step' && ui.modal) ui.modal.stepTouched = true;
  });

  /* ---------- arranque ---------- */
  render();
  if (state.active) wake();
  pushRefresh(); closeRestNotes(); gcPhotos(); slimPhotos();
  if (soc()) setTimeout(function () { socSync(true); }, 600);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && soc()) { socSoon(); if (ui.tab === 'amigos') { rc.feedT = 0; render(); } } });
  window.addEventListener('online', function () { if (soc()) { socSync(true); if (ui.tab === 'amigos') render(); } });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    // Versión nueva: se recarga sola (si estás en mitad de un entreno, al volver a la app; los datos ya están guardados)
    var hadSW = !!navigator.serviceWorker.controller, reloadPending = false, swReg = null;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadSW) { hadSW = true; return; }
      if (state.active && !document.hidden) { reloadPending = true; return; }
      location.reload();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      if (reloadPending) { location.reload(); return; }
      if (swReg) swReg.update().catch(function () { });
    });
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { swReg = r; }).catch(function () { }); });
  }
  window.__gym = { get state() { return state; }, E: E, sounds: sounds, socSync: socSync, get sw() { return sw; }, canPull: function () { return canPull(); }, get socBusy() { return socBusy; }, get clockOn() { return !!clock; } }; // útil para pruebas
})();

</script>

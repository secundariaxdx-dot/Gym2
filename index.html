<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym</title>
<meta name="theme-color" content="#f3f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f4f0; --card: #ffffff; --text: #16181a; --muted: #697077; --line: #e1e4dd; --input: #eceee8;
  --accent: #2c7a10; --on-accent: #ffffff; --accent-soft: #e2f1d9;
  --warn: #9a5b00; --warn-bg: #fdf0d6; --danger: #b3261e; --danger-bg: #fbe6e4;
  --tab-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0e0f; --card: #17191b; --text: #f0f2ec; --muted: #8d959b; --line: #262a2d; --input: #23272a;
    --accent: #b8f24a; --on-accent: #10160a; --accent-soft: #1f2a10;
    --warn: #f5b84b; --warn-bg: #2b2310; --danger: #ff8078; --danger-bg: #301816;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  touch-action: manipulation; overscroll-behavior-y: none;
}
body.modal-open { overflow: hidden; }
#app { padding: calc(env(safe-area-inset-top) + 14px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px); max-width: 560px; margin: 0 auto; }
body.has-timer #app { padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 96px); }
h1 { font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
h2 { font-size: 19px; margin: 0 0 4px; }
h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 22px 4px 8px; font-weight: 600; }
p { margin: 6px 0 12px; }
.cap::first-letter { text-transform: uppercase; }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; margin-top: 18px; }
.pad { padding: 16px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin: 0 0 12px; overflow: hidden; }
.card.pad { padding: 16px; }
.routine { padding: 16px; }
.r-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.r-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.r-btns .btn { flex: 1; }
.r-btns.tight { margin: 0; flex-wrap: nowrap; }
.r-btns.tight .btn { flex: none; min-width: 40px; }

.btn {
  appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
  font: inherit; font-weight: 600; padding: 12px 16px; border-radius: 12px; min-height: 46px; cursor: pointer;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 8px 12px; min-height: 38px; font-size: 14px; }
.btn.wide { width: 100%; margin: 6px 0 10px; }
.link { appearance: none; background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600; padding: 14px; width: 100%; cursor: pointer; }
.link.danger { color: var(--danger); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.chip { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--input); color: var(--muted); border: 0; font-family: inherit; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.tog { cursor: pointer; min-height: 30px; }
.chip.tog.on { background: var(--accent); color: var(--on-accent); }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent-soft); color: var(--text); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.col { flex-direction: column; align-items: stretch; }
.banner.col .r-btns { margin-top: 8px; }
.hint { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
.hint b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.hint.warmup { color: var(--text); background: var(--input); padding: 8px 10px; border-radius: 10px; }
.empty { color: var(--muted); text-align: center; padding: 22px 12px; font-size: 15px; }

.ex-head { appearance: none; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
.ex-name { font-weight: 600; font-size: 16px; }
.ex-count { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; color: var(--muted); background: var(--input); padding: 4px 10px; border-radius: 999px; }
.ex-count.full { background: var(--accent); color: var(--on-accent); }
.ex-body { padding: 0 16px 14px; }
.card.ex.open { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

.set { display: grid; grid-template-columns: 24px 1fr 74px 62px 46px; gap: 8px; align-items: center; margin: 6px 0; }
.set.head { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; margin-top: 4px; }
.set .n { color: var(--muted); font-weight: 700; text-align: center; }
.set .tgt { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
.in { width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid transparent; background: var(--input); color: var(--text); font: inherit; font-size: 17px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; padding: 0 4px; }
.in:focus { outline: none; border-color: var(--accent); }
.chk { height: 46px; width: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.set.done .chk { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.set.done .in { opacity: 0.6; }
.set.err { animation: shake 0.35s; }
.set.err .in { border-color: var(--danger); }
@keyframes shake { 20% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 80% { transform: translateX(-3px); } }
.ex-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

.item { display: block; width: 100%; text-align: left; padding: 12px 16px; font: inherit; color: inherit; cursor: pointer; }
.search { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; padding: 0 14px; margin: 14px 0 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.list { padding: 0 16px; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li.col { flex-direction: column; align-items: stretch; gap: 6px; }
.li-row { display: flex; justify-content: space-between; align-items: baseline; }
.li .right { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter { position: relative; height: 8px; border-radius: 99px; background: var(--input); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
.meter b { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--text); opacity: 0.6; }

.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; }
.switch input { width: 24px; height: 24px; accent-color: var(--accent); }

#tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
.tab { flex: 1; height: var(--tab-h); appearance: none; background: none; border: 0; color: var(--muted); font: inherit; font-size: 11.5px; font-weight: 600; display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center; cursor: pointer; }
.tab.on { color: var(--accent); }

#timer { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 10px); z-index: 25; background: var(--text); color: var(--bg); border-radius: 16px; padding: 10px 12px 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); max-width: 536px; margin: 0 auto; }
#timer.fin { background: var(--accent); color: var(--on-accent); }
#timer .row { display: flex; align-items: center; gap: 8px; }
#timer .tt { flex: 1; display: flex; flex-direction: column; line-height: 1.05; }
#timer .tl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; font-weight: 700; }
#timer .t { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
#timer button { appearance: none; border: 0; border-radius: 10px; min-height: 40px; padding: 0 11px; font: inherit; font-weight: 700; background: color-mix(in srgb, var(--bg) 18%, transparent); color: inherit; cursor: pointer; }
#timer .bar { height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--bg) 22%, transparent); margin-top: 8px; overflow: hidden; }
#timer .bar i { display: block; height: 100%; width: 0; background: currentColor; transition: width 0.25s linear; }

#modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
#modal[hidden], #timer[hidden], #toast[hidden] { display: none; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); animation: up 0.2s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 10px 0 0; }
.sheet .lbl { font-size: 13px; color: var(--muted); font-weight: 600; margin: 14px 0 0; }
.sheet label input, .sheet label select { display: block; width: 100%; margin-top: 4px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 16px; padding: 0 12px; }
.sheet label.switch { color: var(--text); font-size: 16px; font-weight: 500; }
.sheet label.switch input { width: 24px; height: 24px; margin: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ta { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: 13px/1.4 ui-monospace, Menlo, monospace; padding: 10px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 60; max-width: 90vw; }
body.has-timer #toast { bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 100px); }

.li.col .chip { align-self: flex-start; }

</style>
</head>
<body>
<main id="app"></main>
<div id="timer" hidden>
  <div class="row"><div class="tt"><span class="tl">Descanso</span><span class="t">0:00</span></div><button data-a="t-m">−15</button><button data-a="t-p">+15</button><button data-a="t-x">Saltar</button></div>
  <div class="bar"><i></i></div>
</div>
<nav id="tabs"></nav>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script>
/* Motor de progresión — doble progresión por serie, entrenando al fallo.
   Sin dependencias del DOM: se puede probar con node. */
(function (root) {
  'use strict';

  var round1 = function (x) { return Math.round(x * 10) / 10; };
  var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };

  // Estimación de 1RM (Epley) y repeticiones esperadas con otro peso.
  function e1rm(w, r) { return w * (1 + r / 30); }
  function repsAt(oneRm, w) { return 30 * (oneRm / w - 1); }

  // ¿El peso está en la "rejilla" del salto? (los pesos de pila en libras no lo están)
  function onGrid(w, step) {
    var q = w / step;
    return Math.abs(q - Math.round(q)) < 0.05;
  }
  // Redondea w a la rejilla del salto si el peso de referencia está en ella; si no, a 0,5.
  function snap(w, step, refW) {
    if (onGrid(refW === undefined ? w : refW, step)) return round1(Math.round(w / step) * step);
    return round1(Math.round(w * 2) / 2);
  }

  /* Objetivo para una serie a partir de lo que hiciste en esa misma posición. */
  function nextTarget(ex, w, r) {
    var step = ex.step || 2.5;
    var min = ex.repMin || 8;
    var max = ex.repMax || 12;
    if (r >= max) {
      var jumps = r >= max + 3 ? 2 : 1; // si te sobran muchas, salto doble
      var nw = round1(w + step * jumps);
      var est = Math.round(repsAt(e1rm(w, r), nw));
      return { w: nw, r: clamp(est, min, max), kind: 'sube' };
    }
    return { w: w, r: Math.min(r + 1, max), kind: r < min ? 'bajo' : 'repite' };
  }

  /* Referencia: lo último que hiciste con el ejercicio (sesión real o base inicial/ajuste). */
  function reference(ex, sessions) {
    var best = null;
    for (var i = 0; i < sessions.length; i++) {
      var s = sessions[i];
      for (var j = 0; j < s.exercises.length; j++) {
        var e = s.exercises[j];
        if (e.exId === ex.id && e.sets.length) {
          if (!best || s.t > best.t) best = { t: s.t, sets: e.sets, source: 'session' };
        }
      }
    }
    if (ex.baseline && ex.baseline.sets && ex.baseline.sets.length) {
      if (!best || ex.baseline.t >= best.t) best = { t: ex.baseline.t, sets: ex.baseline.sets, source: 'baseline' };
    }
    return best;
  }

  /* Plan de series de trabajo para la próxima sesión. */
  function planSets(ex, ref) {
    if (!ref) {
      var n0 = ex.sets || 3;
      var arr = [];
      for (var k = 0; k < n0; k++) arr.push({ w: 0, r: ex.repMax || 12, kind: 'nuevo' });
      return arr;
    }
    var n = Math.max(ref.sets.length, ex.sets || 0);
    var out = [];
    for (var i = 0; i < n; i++) {
      var src = ref.sets[Math.min(i, ref.sets.length - 1)];
      out.push(nextTarget(ex, src.w, src.r));
    }
    // una serie de bajada nunca pasa del peso de la primera
    for (var m = 1; m < out.length; m++) {
      if (out[m].w > out[0].w) { out[m].w = out[0].w; }
    }
    return out;
  }

  /* Historial de un ejercicio: [{t, sets}] ascendente, incluyendo la base inicial. */
  function history(ex, sessions) {
    var h = [];
    if (ex.baseline && ex.baseline.sets && ex.baseline.sets.length) h.push({ t: ex.baseline.t, sets: ex.baseline.sets });
    sessions.forEach(function (s) {
      s.exercises.forEach(function (e) {
        if (e.exId === ex.id && e.sets.length) h.push({ t: s.t, sets: e.sets });
      });
    });
    h.sort(function (a, b) { return a.t - b.t; });
    return h;
  }

  function bestE1(sets) {
    var b = 0;
    sets.forEach(function (s) { if (s.w > 0 && s.r > 0) b = Math.max(b, e1rm(s.w, s.r)); });
    return b;
  }

  /* Estancamiento: las últimas N sesiones no mejoran un 1 % la mejor marca anterior. */
  function stallInfo(ex, hist) {
    var N = (ex.fatigue || 2) >= 3 ? 2 : 3;
    // tras ignorar el aviso o aplicar un ajuste, se empieza a contar de nuevo
    var reset = ex.stallResetT || 0;
    hist = hist.filter(function (h) { return h.t > reset; });
    if (hist.length < N + 1) return { stalled: false, n: N };
    var prev = hist.slice(0, hist.length - N);
    var last = hist.slice(hist.length - N);
    var prevBest = 0;
    prev.forEach(function (h) { prevBest = Math.max(prevBest, bestE1(h.sets)); });
    var improved = last.some(function (h) { return bestE1(h.sets) > prevBest * 1.01; });
    return { stalled: !improved && prevBest > 0, n: N, prevBest: round1(prevBest) };
  }

  /* Propuesta de ajuste: bajar ~10 % y volver a subir desde ahí. */
  function deloadBaseline(ex, ref, now) {
    var sets = ref.sets.map(function (s) {
      var w = snap(s.w * 0.9, ex.step || 2.5, s.w);
      if (w < (ex.step || 2.5)) w = s.w;
      return { w: w, r: clamp(s.r + 3, ex.repMin || 8, (ex.repMax || 12) - 1) };
    });
    return { t: now, sets: sets };
  }

  /* Calentamiento sugerido (no se marca ni cuenta). Solo para el primer ejercicio de cada músculo. */
  function warmups(ex, topW, firstOfMuscle) {
    var step = ex.step || 2.5;
    if (!firstOfMuscle || !(topW > step * 3)) return [];
    var plan = (ex.equip === 'barra' || (ex.fatigue || 2) >= 3) ? [[0.4, 8], [0.65, 4]] : [[0.5, 8]];
    var out = [];
    plan.forEach(function (p) {
      var w = snap(topW * p[0], step, topW);
      if (w > 0 && w < topW && (!out.length || w > out[out.length - 1].w)) out.push({ w: w, r: p[1] });
    });
    return out;
  }

  function restFor(ex) {
    if (ex.rest) return ex.rest;
    var f = ex.fatigue || 2;
    return f >= 3 ? 180 : f === 2 ? 120 : 90;
  }

  /* Récord: mejor 1RM estimado de una serie frente a todo lo anterior. */
  function isPR(prevBest, w, r) {
    if (!(w > 0 && r > 0 && r <= 15)) return false;
    return prevBest > 0 && e1rm(w, r) > prevBest * 1.005;
  }

  /* Fatiga y descanso por músculo. */
  var DAY = 86400000;
  function fatigueSummary(sessions, now) {
    var by = {};
    sessions.forEach(function (s) {
      s.exercises.forEach(function (e) {
        var f = e.fatigue || 2;
        var muscles = [[e.muscle, 1]].concat((e.sec || []).map(function (m) { return [m, 0.5]; }));
        muscles.forEach(function (mw) {
          var m = mw[0]; if (!m) return;
          var o = by[m] || (by[m] = { muscle: m, last: 0, lastHeavy: false, l7: 0, l28: 0 });
          var load = e.sets.length * f * mw[1];
          var age = now - s.t;
          if (age <= 7 * DAY) o.l7 += load;
          if (age <= 35 * DAY && age > 7 * DAY) o.l28 += load;
          if (s.t > o.last) { o.last = s.t; o.lastHeavy = f >= 3 && mw[1] === 1; }
          else if (s.t === o.last && f >= 3 && mw[1] === 1) o.lastHeavy = true;
        });
      });
    });
    return Object.keys(by).map(function (k) {
      var o = by[k];
      var hours = (now - o.last) / 3600000;
      var need = o.lastHeavy ? 72 : 48;
      var avg = o.l28 / 4;
      var status = 'ok';
      if (hours < need) status = 'descanso';
      else if (avg > 0 && o.l7 > avg * 1.3) status = 'alta';
      return { muscle: o.muscle, hours: hours, need: need, l7: round1(o.l7), avg: round1(avg), status: status };
    }).sort(function (a, b) { return a.hours - b.hours; });
  }

  var api = {
    e1rm: e1rm, repsAt: repsAt, nextTarget: nextTarget, reference: reference, planSets: planSets,
    history: history, stallInfo: stallInfo, deloadBaseline: deloadBaseline, warmups: warmups,
    restFor: restFor, isPR: isPR, fatigueSummary: fatigueSummary, bestE1: bestE1, snap: snap, round1: round1
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Engine = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Datos iniciales: tus rutinas y la última sesión de cada ejercicio (capturas de Symmetry, 11/11/2026). */
(function (root) {
  'use strict';
  var LB = 0.45359237;
  var T = Date.now();

  function ex(id, name, equip, muscle, sec, o) {
    var stepByEquip = { maquina: 5, polea: 2.5, mancuerna: 2, barra: 2.5, corporal: 1 };
    o = o || {};
    var step = o.step || stepByEquip[equip] || 2.5;
    return {
      id: id, name: name, equip: equip, muscle: muscle, sec: sec || [],
      step: step, stepUnit: o.stepUnit || 'kg', repMin: 8, repMax: 12,
      fatigue: o.fatigue || 2, sets: o.sets || 3, rest: o.rest || 0,
      baseline: { t: T, sets: o.base.map(function (b) { return { w: b[0], r: b[1] }; }) }
    };
  }
  var lb10 = Math.round(10 * LB * 100) / 100; // 10 lb en kg (supuesto para pilas en libras)

  var exercises = [
    // PULL
    ex('jalon', 'Jalón al pecho (máquina)', 'maquina', 'Dorsales', ['Bíceps'], { fatigue: 2, base: [[105, 11], [85, 11], [85, 8]] }),

<script>
(function () {

  var MUSCLES = ['Pecho', 'Hombros', 'Tríceps', 'Bíceps', 'Antebrazos', 'Dorsales', 'Espalda', 'Trapecio', 'Lumbares', 'Abdominales', 'Cuádriceps', 'Isquios', 'Glúteos', 'Gemelos'];

  /* ---------- utilidades ---------- */

  /* ---------- estado y guardado ---------- */

  var ui = { tab: 'hoy', modal: null, query: '', histOpen: null, toast: '' };

  /* ---------- entreno en curso ---------- */
  function buildEntry(ex, taken) {

    var plan = E.planSets(ex, ref);
    var first = !taken[ex.muscle];
    taken[ex.muscle] = 1;
    var hist = E.history(ex, state.sessions);

    return {
      exId: ex.id, name: ex.name, muscle: ex.muscle, sec: ex.sec || [], fatigue: ex.fatigue || 2,

  function startTimer(ex) {

  var audio = null;

  }
  function beep() {

  function updateTimer() {

  }

  /* ---------- vistas ---------- */
  var ICON = {

  function svg(p) { return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>'; }

  function doFinish(saveRoutine) {
    var a = state.active, now = Date.now(), prs = [], total = 0;
    var exs = [];
    a.entries.forEach(function (e) {
      var sets = e.sets.filter(function (s) { return s.done && num(s.r) > 0; }).map(function (s) { return { w: num(s.w) || 0, r: num(s.r) }; });
      if (!sets.length) return;
      total += sets.length;
      var ex = exById(e.exId);
      if (ex) {
        var prev = 0;
        E.history(ex, state.sessions).forEach(function (h) { prev = Math.max(prev, E.bestE1(h.sets)); });
        var bestSet = null;
        sets.forEach(function (s) { if (!bestSet || E.e1rm(s.w, s.r) > E.e1rm(bestSet.w, bestSet.r)) bestSet = s; });
        if (bestSet && E.isPR(prev, bestSet.w, bestSet.r)) prs.push({ exId: e.exId, name: e.name, w: bestSet.w, r: bestSet.r });
      }
      exs.push({ exId: e.exId, name: e.name, muscle: e.muscle, sec: e.sec, fatigue: e.fatigue, sets: sets });
    });
    state.sessions.push({ id: a.id, t: now, t0: a.t0, key: a.key, name: a.name, exercises: exs, prs: prs });
    if (saveRoutine && state.routines[a.key]) state.routines[a.key].ids = a.entries.map(function (e) { return e.exId; }).filter(exById);
    var min = Math.max(1, Math.round((now - a.t0) / 60000));
    state.active = null; timer = null; unwake(); save();
    openModal({ type: 'summary', sets: total, min: min, prs: prs });
    render();
  }

      setTimeout(function () { URL.revokeObjectURL(url); }, 4000); ok();

      case 'ex-del': {
        var dx = ui.modal.ex;
        ask('Eliminar ejercicio', 'Se borra de tu lista y de las rutinas. El historial de sesiones se conserva.', 'Eliminar', function () {
          state.exercises = state.exercises.filter(function (x) { return x.id !== dx.id; });
          Object.keys(state.routines).forEach(function (kk) { state.routines[kk].ids = state.routines[kk].ids.filter(function (x) { return x !== dx.id; }); });
          save(); closeModal(); render();
        }, true); break;
      }
      case 'edit-routine': openModal({ type: 'routine', key: el.getAttribute('data-k') }); break;
      case 'r-up': case 'r-down': {
        var ids = state.routines[ui.modal.key].ids, to = a === 'r-up' ? i - 1 : i + 1;
        if (to >= 0 && to < ids.length) { var tmp = ids[i]; ids[i] = ids[to]; ids[to] = tmp; save(); renderModal(); render(); }
        break;
      }
      case 'r-rm': state.routines[ui.modal.key].ids.splice(i, 1); save(); renderModal(); render(); break;
      case 'r-add': openModal({ type: 'pick', ctx: 'routine', key: ui.modal.key }); break;
      case 'hist': ui.histOpen = ui.histOpen === el.getAttribute('data-id') ? null : el.getAttribute('data-id'); render(); break;
      case 'del-sess': { var sid = el.getAttribute('data-id'); ask('Borrar sesión', 'Se elimina del historial y de los cálculos.', 'Borrar', function () { state.sessions = state.sessions.filter(function (x) { return x.id !== sid; }); ui.histOpen = null; save(); closeModal(); render(); }, true); break; }
      case 'backup': backup(); break;
      case 'copy': {
        var txt = exportData();
        var fall = function () { openModal({ type: 'text', title: 'Copia de seguridad', text: txt }); setTimeout(function () { var ta = $('#export-ta'); if (ta) { ta.focus(); ta.select(); } }, 50); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { state.settings.lastBackup = Date.now(); save(); toast('Copiado al portapapeles'); render(); }).catch(fall); else fall();
        break;
      }
      case 'import-file': $('#file').click(); break;
      case 'import-paste': openModal({ type: 'paste' }); break;
      case 'paste-yes': importText($('#paste').value); break;
      case 'reset': ask('Restaurar datos iniciales', 'Se borran tu historial y los cambios hechos a ejercicios y rutinas.', 'Restaurar', function () { state = fresh(); timer = null; unwake(); save(); closeModal(); ui.tab = 'hoy'; render(); toast('Datos iniciales restaurados'); }, true); break;
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target, f = t.getAttribute && t.getAttribute('data-f'); if (!f) return;
    if (f === 'w' || f === 'r') {
      var s = state.active.entries[+t.getAttribute('data-i')].sets[+t.getAttribute('data-j')];
      s[f] = t.value; if (s.done) { s.done = false; var row = t.closest('.set'); if (row) row.classList.remove('done'); }
      save();
    } else if (f === 'q') { ui.query = t.value; $('#ex-list').innerHTML = exListHtml(ui.query.trim().toLowerCase()); }
    else if (f === 'pq') { $('#pick-list').innerHTML = pickList(t.value); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.getAttribute && t.getAttribute('data-f') === 'sound') { state.settings.sound = t.checked; save(); }
    else if (t.id === 'file' && t.files && t.files[0]) { var rd = new FileReader(); rd.onload = function () { importText(String(rd.result)); }; rd.readAsText(t.files[0]); t.value = ''; }
    else if (t.id === 'f-equip' && ui.modal && ui.modal.type === 'exedit' && ui.modal.isNew && !ui.modal.stepTouched) { $('#f-step').value = fmt(STEP_DEFAULT[t.value] || 2.5); $('#f-unit').value = 'kg'; }
  });
  document.addEventListener('focusin', function (ev) {
    var t = ev.target;
    if (t.classList && t.classList.contains('in')) setTimeout(function () { try { t.select(); } catch (e) { /* nada */ } }, 0);
    if (t.id === 'f-step' && ui.modal) ui.modal.stepTouched = true;
  });

  /* ---------- arranque ---------- */
  render();
  if (state.active) wake();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
  window.__gym = { get state() { return state; }, E: E }; // útil para pruebas
})();

</script>
</body>
</html>
